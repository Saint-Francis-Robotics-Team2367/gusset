# Runs Gusset's automatic tests on every pull request and every push to main,
# on Mac, Windows and Linux (the team uses both Mac and Windows).
# Fusion isn't needed: the tests cover the pure-Python lib/*_core.py code.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install pytest openpyxl ezdxf
      - name: Run the tests
        run: python -m pytest tests -v
      - name: Check the release builds
        run: python tools/make_release.py
